<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VetLife — 1.0</title>

<style>
:root{
--teal:#087f78;
--teal2:#159b92;
--green:#2d9b45;
--lime:#b9ed55;
--cream:#f8f4e9;
--paper:#fffdf7;
--ink:#26363a;
--muted:#718084;
--line:#d9d4c7;
--gold:#f1bd35;
--blue:#35a9cf;
--shadow:0 8px 22px rgba(35,55,55,.12)
}

*{box-sizing:border-box}

html,body{
margin:0;
background:#dfe7e3;
font-family:Arial,Helvetica,sans-serif;
color:var(--ink)
}

button{font-family:inherit}

.app{
width:min(100%,430px);
min-height:100vh;
margin:auto;
background:var(--cream);
padding-bottom:76px;
overflow:hidden
}

.topbar{
background:linear-gradient(135deg,#087f78,#12988e);
color:white;
padding:15px 15px 12px;
box-shadow:0 3px 12px #0002;
position:relative;
z-index:3
}

.brand{
font-size:32px;
font-weight:900;
letter-spacing:-1.5px
}

.brand span{color:var(--lime)}

.paws{
color:#167bc2;
font-size:22px;
margin-left:5px
}

.tagline{
font-size:10px;
opacity:.9;
margin-left:4px;
margin-top:-5px
}

.topstats{
display:grid;
grid-template-columns:1.1fr 1fr 1fr;
gap:7px;
margin-top:12px
}

.stat{
background:#ffffff1e;
border:1px solid #ffffff25;
border-radius:13px;
padding:7px 5px;
text-align:center;
font-size:10px
}

.stat b{
display:block;
font-size:14px;
margin-top:2px
}

.page{padding:12px}

.hero{
border-radius:22px;
overflow:hidden;
box-shadow:var(--shadow);
border:1px solid #d8ddcf;
background:linear-gradient(150deg,#dff4e8,#fff5cb);
margin-bottom:12px
}

.hero-art{
height:245px;
position:relative;
overflow:hidden;
background:linear-gradient(#9bd2d1,#dcebdc 62%,#c8b083 62% 100%)
}

.cloud{
position:absolute;
background:#ffffff99;
border-radius:50%;
width:90px;
height:28px;
filter:blur(1px)
}

.c1{left:20px;top:28px}
.c2{right:25px;top:50px;width:70px}

.building{
position:absolute;
bottom:0;
left:15px;
width:205px;
height:105px;
background:#e7ece5;
border:3px solid #b6c2b9;
border-radius:8px 8px 0 0;
box-shadow:inset 0 0 0 5px #d6ddd6
}

.building:before{
content:"VET";
position:absolute;
left:15px;
top:10px;
color:#087f78;
font-weight:900;
font-size:18px
}

.window{
position:absolute;
width:38px;
height:27px;
background:#83b9c0;
border:3px solid #718d90;
border-radius:3px
}

.w1{left:18px;bottom:19px}
.w2{left:76px;bottom:19px}
.w3{left:134px;bottom:19px}

.door{
position:absolute;
right:12px;
bottom:0;
width:38px;
height:62px;
background:#927a61;
border-radius:4px 4px 0 0
}

.tree{
position:absolute;
right:24px;
bottom:27px;
font-size:75px
}

.sun{
position:absolute;
right:35px;
top:20px;
font-size:42px
}

.doctorHero{
position:absolute;
right:10px;
bottom:12px;
font-size:104px;
filter:drop-shadow(0 5px 3px #0002)
}

.hero-copy{
padding:15px;
text-align:center
}

.hero-copy h1{
font-size:23px;
margin:0 0 5px
}

.hero-copy p{
margin:0 0 12px;
color:var(--muted);
font-size:13px
}

.primary{
border:0;
background:linear-gradient(180deg,#36a44d,#208b3b);
color:white;
font-weight:900;
border-radius:11px;
padding:12px 18px;
box-shadow:0 4px 0 #176d2d;
width:100%;
font-size:14px
}

.section-title{
font-size:19px;
font-weight:900;
margin:16px 3px 9px
}

.menu-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.menu-card{
border:1px solid var(--line);
background:var(--paper);
border-radius:13px;
padding:11px 8px;
text-align:center;
box-shadow:0 3px 10px #00000008;
color:var(--ink)
}

.menu-card .ico{font-size:25px}

.menu-card b{
display:block;
font-size:10px;
margin-top:4px
}

.progress-card{
background:var(--paper);
border:1px solid var(--line);
border-radius:16px;
padding:14px;
margin-top:12px;
box-shadow:var(--shadow)
}

.progress-head{
display:flex;
justify-content:space-between;
font-weight:800;
font-size:13px
}

.bar{
height:10px;
background:#e2e5df;
border-radius:99px;
overflow:hidden;
margin-top:9px
}

.bar i{
display:block;
height:100%;
background:linear-gradient(90deg,#2da24d,#43b8cf);
border-radius:99px
}

.screen-head{
display:flex;
align-items:center;
gap:8px;
margin:5px 2px 12px
}

.back{
border:0;
background:#fff;
border:1px solid var(--line);
border-radius:9px;
padding:8px 11px
}

.screen-head h2{
margin:0;
font-size:19px
}

.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:16px;
padding:13px;
margin:9px 0;
box-shadow:0 4px 13px #00000009
}

.pet-art{
height:180px;
border-radius:13px;
background:linear-gradient(#cbe5d9,#f4ead1);
display:flex;
align-items:center;
justify-content:center;
font-size:105px;
position:relative;
overflow:hidden
}

.pet-art:after{
content:"";
position:absolute;
bottom:0;
left:0;
right:0;
height:35px;
background:#b8c99b
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
margin-top:9px
}

.info{
background:#f1eee5;
border-radius:8px;
padding:8px;
font-size:10px
}

.info b{
display:block;
font-size:9px;
color:#7b8585;
margin-bottom:2px
}

.case-desc{
font-size:12px;
line-height:1.45;
color:#637275
}

.steps{
display:flex;
align-items:center;
margin:2px 0 14px
}

.step{
flex:1;
text-align:center;
font-size:8px;
color:#999
}

.dot{
width:21px;
height:21px;
border-radius:50%;
background:#ddd;
margin:auto auto 3px;
padding-top:4px;
font-weight:bold
}

.step.on{
color:var(--teal);
font-weight:800
}

.step.on .dot{
background:var(--teal);
color:white
}

.option{
width:100%;
text-align:left;
background:white;
border:1px solid #d9ddd7;
border-radius:9px;
padding:10px;
margin:4px 0;
font-size:11px
}

.option.selected{
background:#eaf7ec;
border-color:#2d9b45
}

.result{
background:linear-gradient(145deg,#087f78,#16a096);
color:white;
text-align:center;
padding:22px;
border-radius:18px
}

.result .big{font-size:70px}

.reward{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:12px 0
}

.reward div{
background:#ffffff20;
border-radius:10px;
padding:10px;
font-weight:800
}

.clinic-art{
height:230px;
border-radius:14px;
background:linear-gradient(#d8e9e2 0 70%,#c9a77b 70%);
position:relative;
overflow:hidden;
border:3px solid #b9b3a3
}

.clinic-art .desk{
position:absolute;
left:10%;
bottom:14%;
font-size:50px
}

.clinic-art .bed{
position:absolute;
right:8%;
bottom:15%;
font-size:58px
}

.clinic-art .doc{
position:absolute;
left:42%;
bottom:18%;
font-size:65px
}

.clinic-art .plant{
position:absolute;
right:5%;
top:8%;
font-size:38px
}

.list-row{
display:flex;
align-items:center;
gap:8px;
border-bottom:1px solid #eee;
padding:10px 0;
font-size:11px
}

.list-row:last-child{border:0}

.list-row span:last-child{
margin-left:auto;
font-weight:800
}

.shop-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.product{
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
text-align:center;
font-size:10px
}

.product .pico{font-size:36px}

.smallbtn{
border:0;
background:#e8f4ef;
color:#087f78;
border-radius:8px;
padding:7px;
width:100%;
font-size:10px;
font-weight:800
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(430px,100%);
height:76px;
background:#fff;
border-top:1px solid #d7d3c9;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:20;
box-shadow:0 -5px 15px #00000008
}

.nav{
border:0;
background:none;
color:#687477;
font-size:9px
}

.nav .ni{
display:block;
font-size:21px;
margin-bottom:2px
}

.nav.active{
color:#087f78;
font-weight:900
}

.toast{
position:fixed;
left:50%;
bottom:88px;
transform:translateX(-50%);
background:#26363a;
color:#fff;
padding:10px 14px;
border-radius:10px;
font-size:11px;
z-index:50;
display:none
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">
Vet<span>Life</span><span class="paws">🐾</span>
</div>

<div class="tagline">
Aprenda. Atenda. Evolua.
</div>

<div class="topstats">

<div class="stat">
🪙 MOEDAS
<b id="coins">4250</b>
</div>

<div class="stat">
💎 RECURSOS
<b id="gems">125</b>
</div>

<div class="stat">
⭐ NÍVEL
<b id="level">3</b>
</div>

</div>
</header>

<main id="page" class="page"></main>

<nav class="bottom">

<button class="nav active" id="homeNav" onclick="home()">
<span class="ni">🏠</span>
Início
</button>

<button class="nav" id="missionNav" onclick="missions()">
<span class="ni">☑️</span>
Missões
</button>

<button class="nav" id="clinicNav" onclick="clinic()">
<span class="ni">🏥</span>
Clínica
</button>

<button class="nav" id="profileNav" onclick="profile()">
<span class="ni">👤</span>
Perfil
</button>

<button class="nav" id="moreNav" onclick="more()">
<span class="ni">•••</span>
Mais
</button>

</nav>

<div id="toast" class="toast"></div>

</div>

<script>

const data={
coins:4250,
gems:125,
xp:350,
level:3,
done:0,
clinicLevel:1,
avatar:"👩‍⚕️",
missions:{
patients:0,
diagnosis:0,
exams:0
}
};

let s=
JSON.parse(localStorage.getItem("vetlife10")||"null")
||data;

const casesData=[

{
name:"Thor",
species:"Canino",
breed:"Golden Retriever",
age:"4 anos",
sex:"Macho",
pet:"🐶",
reward:250,
desc:"Meu cachorro não está bem. Está bebendo mais água, urinando mais e perdeu peso.",
questions:[
"Há quanto tempo começou?",
"Mudou a alimentação?",
"Está bebendo mais água?",
"Está urinando mais?",
"Está perdendo peso?"
],
diagnosis:[
"Diabetes mellitus",
"Doença renal crônica",
"Infecção urinária",
"Hiperadrenocorticismo"
],
correct:0
},

{
name:"Luna",
species:"Felino",
breed:"SRD",
age:"3 anos",
sex:"Fêmea",
pet:"🐱",
reward:300,
desc:"Luna está vomitando e perdeu o apetite nos últimos dois dias.",
questions:[
"Quando começaram os vômitos?",
"Comeu algo diferente?",
"Está bebendo água?",
"Há diarreia?",
"Já teve episódios anteriores?"
],
diagnosis:[
"Gastrite",
"Obstrução gastrointestinal",
"Doença renal",
"Parasitismo"
],
correct:0
},

{
name:"Max",
species:"Canino",
breed:"Beagle",
age:"6 anos",
sex:"Macho",
pet:"🐶",
reward:450,
desc:"Max apresenta tosse persistente, cansaço e dificuldade respiratória após esforço.",
questions:[
"Quando começou a tosse?",
"Piora com exercício?",
"Há desmaios?",
"Usa medicamentos?",
"Já teve doença cardíaca?"
],
diagnosis:[
"Doença cardíaca",
"Traqueíte",
"Alergia",
"Parasitismo"
],
correct:0
}

];

function save(){
localStorage.setItem("vetlife10",JSON.stringify(s))
}

function stats(){
coins.textContent=s.coins;
gems.textContent=s.gems;
level.textContent=s.level
}

function nav(id){
document
.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
?.classList.add("active")
}

function toast(t){

const x=document.getElementById("toast");

x.textContent=t;
x.style.display="block";

setTimeout(
()=>x.style.display="none",
1800
)

}

function addXP(n){

s.xp+=n;

if(s.xp>=800){
s.level++;
s.xp-=800
}

s.coins+=n;

save();
stats()
}

function home(){

nav("homeNav");

page.innerHTML=`

<section class="hero">

<div class="hero-art">

<div class="sun">☀️</div>

<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="building">

<div class="window w1"></div>
<div class="window w2"></div>
<div class="window w3"></div>

<div class="door"></div>

</div>

<div class="tree">🌳</div>

<div class="doctorHero">
👩‍⚕️
</div>

</div>

<div class="hero-copy">

<h1>
Bem-vinda à VetLife! 🐾
</h1>

<p>
Sua jornada para se tornar uma excelente veterinária começa aqui.
</p>

<button class="primary" onclick="cases()">
▶ JOGAR
</button>

</div>

</section>

<div class="section-title">
Menu principal
</div>

<div class="menu-grid">

<button class="menu-card" onclick="clinic()">
<div class="ico">🏥</div>
<b>MINHA CLÍNICA</b>
</button>

<button class="menu-card" onclick="profile()">
<div class="ico">👩‍⚕️</div>
<b>MEU PERSONAGEM</b>
</button>

<button class="menu-card" onclick="cases()">
<div class="ico">🐾</div>
<b>CASOS</b>
</button>

<button class="menu-card" onclick="ranking()">
<div class="ico">🏆</div>
<b>RANKING</b>
</button>

<button class="menu-card" onclick="shop()">
<div class="ico">🛒</div>
<b>LOJA</b>
</button>

<button class="menu-card" onclick="more()">
<div class="ico">⚙️</div>
<b>CONFIGURAÇÕES</b>
</button>

</div>

<div class="progress-card">

<div class="progress-head">

<span>📚 Sua evolução</span>

<span>
Nível ${s.level}
</span>

</div>

<div class="bar">
<i style="width:${s.xp/8}%"></i>
</div>

<p style="font-size:11px;color:#718084;margin:7px 0 0">

${s.xp}/800 XP •
${s.done} casos concluídos

</p>

</div>

`

}

function head(t){

return`

<div class="screen-head">

<button class="back" onclick="home()">
←
</button>

<h2>
${t}
</h2>

</div>

`

}

function profile(){

nav("profileNav");

page.innerHTML=
head("Meu Personagem")+
`

<div class="card" style="text-align:center">

<div style="font-size:82px">
${s.avatar}
</div>

<h2 style="margin:4px">
Dra. Júlia Martins
</h2>

<p style="color:#718084;font-size:11px">
Clínica Geral
</p>

<b>
NÍVEL ${s.level}
</b>

<div class="bar">
<i style="width:${s.xp/8}%"></i>
</div>

<p style="font-size:10px;color:#718084">
${s.xp}/800 XP
</p>

</div>

<div class="card">

<b>
ATRIBUTOS
</b>

${[
"💚 Empatia",
"🧠 Raciocínio",
"⚡ Agilidade",
"💬 Comunicação",
"📋 Organização"
]
.map((x,i)=>`

<div class="list-row">

${x}

<span>
${"●".repeat(3+i%2)}
${"○".repeat(2-i%2)}
</span>

</div>

`).join("")}

</div>

<div class="card">

<button class="primary"
onclick="changeAvatar()">

PERSONALIZAR PERSONAGEM

</button>

</div>

`

}

function changeAvatar(){

s.avatar=
s.avatar==="👩‍⚕️"
?"🧑‍⚕️"
:s.avatar==="🧑‍⚕️"
?"👨‍⚕️"
:"👩‍⚕️";

save();
profile()

}

function clinic(){

nav("clinicNav");

page.innerHTML=
head("Minha Clínica")+
`

<div class="card">

<div class="clinic-art">

<div class="plant">
🪴
</div>

<div class="desk">
💻
</div>

<div class="doc">
${s.avatar}
</div>

<div class="bed">
🛏️
</div>

</div>

</div>

<div class="card">

<b>
Nível da Clínica
</b>

<span style="float:right">
⭐ ${s.clinicLevel}
</span>

<div style="color:#e7b21f;font-size:20px;margin-top:6px">

${"★".repeat(s.clinicLevel)}
${"☆".repeat(5-s.clinicLevel)}

</div>

</div>

<div class="card">

<b>
Estruturas
</b>

<div class="list-row">
🩺 Consultório 1
<span>Nível 1 ›</span>
</div>

<div class="list-row">
🛎️ Recepção
<span>Nível 1 ›</span>
</div>

<div class="list-row">
🪑 Sala de Espera
<span>Nível 1 ›</span>
</div>

</div>

<div class="card">

<b>
Equipamentos
</b>

<div class="menu-grid">

<div class="menu-card">
🛏️
<b>Mesa de Atendimento</b>
</div>

<div class="menu-card">
🩺
<b>Estetoscópio</b>
</div>

<div class="menu-card">
🌡️
<b>Termômetro</b>
</div>

<div class="menu-card">
⚖️
<b>Balança</b>
</div>

</div>

<button class="primary"
onclick="upgradeClinic()">

MELHORIAS

</button>

</div>

`

}

function upgradeClinic(){

if(s.coins<1500)
return toast("Você precisa de 1.500 moedas.");

s.coins-=1500;

s.clinicLevel=
Math.min(5,s.clinicLevel+1);

save();
stats();
clinic();

toast("Clínica melhorada!")

}

function cases(){

nav("homeNav");

page.innerHTML=
head("Mapa de Casos")+

casesData.map((c,i)=>`

<div class="card">

<div class="pet-art">
${c.pet}
</div>

<h2 style="margin:10px 0 5px">
${c.name}
</h2>

<p class="case-desc">
${c.desc}
</p>

<div class="info-grid">

<div class="info">
<b>ESPÉCIE</b>
${c.species}
</div>

<div class="info">
<b>RAÇA</b>
${c.breed}
</div>

<div class="info">
<b>IDADE</b>
${c.age}
</div>

<div class="info">
<b>SEXO</b>
${c.sex}
</div>

</div>

<button class="primary"
onclick="startCase(${i})">

INICIAR CONSULTA

</button>

</div>

`).join("")

}

function steps(n){

let a=[
"Paciente",
"Anamnese",
"Exame",
"Exames",
"Diagnóstico",
"Conduta"
];

return`

<div class="steps">

${a.map((x,i)=>`

<div class="step ${i<=n?"on":""}">

<div class="dot">
${i+1}
</div>

${x}

</div>

`).join("")}

</div>

`

}

function startCase(i){
flow(i,0)
}

function flow(i,st){

let c=casesData[i];

if(st===0)

page.innerHTML=
head("Novo Paciente")+
`

<div class="card">

${steps(0)}

<div class="pet-art">
${c.pet}
</div>

<div class="case-desc"
style="margin-top:10px">

Olá, doutora.
Meu nome é <b>${c.name}</b>
e não estou bem.

</div>

<div class="info-grid">

<div class="info">
<b>ESPÉCIE</b>
${c.species}
</div>

<div class="info">
<b>RAÇA</b>
${c.breed}
</div>

<div class="info">
<b>IDADE</b>
${c.age}
</div>

<div class="info">
<b>SEXO</b>
${c.sex}
</div>

</div>

<button class="primary"
onclick="flow(${i},1)">

INICIAR CONSULTA

</button>

</div>

`;

else if(st===1)

page.innerHTML=
head("Anamnese")+
`

<div class="card">

${steps(1)}

<b>
O que você gostaria de perguntar?
</b>

${c.questions.map(q=>`

function diagnose(i,k){

let c=casesData[i];

if(k!==c.correct)
return toast(
"Hipótese incorreta — revise os achados."
);

page.innerHTML=
head("Conduta")+
`

<div class="card">

${steps(5)}

<div style="background:#eaf7ec;border-radius:10px;padding:10px;font-size:11px">

Diagnóstico:
<b>${c.diagnosis[k]}</b>

</div>

${[
"Orientar tutor",
"Registrar achados",
"Solicitar acompanhamento"
].map(x=>`

<div class="list-row">

☑️ ${x}

<span>
✓
</span>

</div>

`).join("")}

<button class="primary"
onclick="finishCase(${i})">

FINALIZAR

</button>

</div>

`

}

function finishCase(i){

let c=casesData[i];

s.done++;

s.missions.patients++;
s.missions.diagnosis++;
s.missions.exams++;

addXP(150);

s.coins+=c.reward;

save();
stats();

page.innerHTML=`

<div class="result">

<div class="big">
${c.pet}
</div>

<div style="font-size:28px">

</div>

<h1>

<p>

<div class="reward">

<div>

+${c.reward}

</div>

onclick="cases()">

</button>

</div>

`

}

function buy(n){

if(s.coins<n)
return toast("Moedas insuficientes.");

s.coins-=n;

save();
stats();

toast("Item comprado!")

}
