<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VetLife 1.0</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#e9e4d8;
font-family:Arial,sans-serif;
color:#263238
}
button{font:inherit;cursor:pointer}

.app{
max-width:430px;
margin:auto;
background:#f7f3e9;
min-height:100vh;
padding-bottom:72px
}

.top{
background:#087f78;
color:#fff;
padding:13px 14px 10px;
position:sticky;
top:0;
z-index:5
}

.topline{
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:26px;
font-weight:800
}

.logo b{color:#b9ee5a}

.paw{font-size:22px}

.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
margin-top:9px
}

.stat{
background:#ffffff20;
border-radius:10px;
padding:6px;
text-align:center;
font-size:11px
}

.stat strong{
display:block;
font-size:14px;
margin-top:2px
}

.content{padding:12px}

.screenTitle{
font-weight:800;
font-size:18px;
text-align:center;
margin:3px 0 10px
}

.card{
background:#fff;
border:1px solid #d9d4c9;
border-radius:14px;
padding:12px;
margin:9px 0;
box-shadow:0 2px 7px #0000000d
}

.hero{
background:linear-gradient(145deg,#d9f2e8,#fff4cc);
text-align:center;
padding:16px
}

.heroAvatar{font-size:80px}

.hero h1{
margin:5px 0;
font-size:24px
}

.muted{
color:#657779;
font-size:13px;
line-height:1.4
}

.btn{
border:0;
border-radius:9px;
background:#16953d;
color:#fff;
font-weight:800;
padding:11px 14px;
width:100%;
margin-top:8px
}

.btn.teal{background:#087f78}
.btn.light{
background:#e7f2ef;
color:#087f78
}
.btn.gold{
background:#e8b52c;
color:#493900
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.mini{
border:1px solid #d9d4c9;
background:#fff;
border-radius:10px;
padding:10px;
text-align:center;
font-size:12px
}

.mini b{
display:block;
margin-top:5px
}

.bar{
height:8px;
background:#e4e5e2;
border-radius:8px;
overflow:hidden
}

.bar i{
display:block;
height:100%;
background:#29a7c5
}

.steps{
display:flex;
justify-content:space-between;
margin:8px 0 14px
}

.step{
text-align:center;
font-size:9px;
color:#777;
flex:1
}

.dot{
width:22px;
height:22px;
border-radius:50%;
background:#ddd;
margin:auto;
padding-top:4px;
font-weight:bold
}

.step.on .dot{
background:#15953e;
color:#fff
}

.step.on{
color:#263238;
font-weight:bold
}

.pet{
font-size:76px;
text-align:center
}

.speech{
background:#fff;
border:1px solid #ddd;
border-radius:10px;
padding:10px;
margin:5px 0 12px;
position:relative;
font-size:13px
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:4px;
font-size:11px
}

.info div{
background:#f6f3ec;
padding:7px;
border-radius:7px
}

.choice{
width:100%;
text-align:left;
background:#fff;
border:1px solid #d7d7d2;
border-radius:9px;
padding:10px;
margin:4px 0;
font-size:12px
}

.choice.ok{
border-color:#15953e;
background:#edf8ef
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:12px
}

.row:last-child{border:0}

.check{
color:#15953e;
font-weight:bold
}

.clinic{
height:245px;
background:linear-gradient(#dcefe8 0 72%,#caa77b 72%);
border:3px solid #c6b59d;
border-radius:12px;
position:relative;
overflow:hidden
}

.clinic .obj{
position:absolute;
font-size:34px
}

.o1{left:7%;top:12%}
.o2{right:8%;top:13%}
.o3{left:11%;bottom:9%}
.o4{right:12%;bottom:10%}

.doctor{
position:absolute;
font-size:50px;
left:43%;
top:48%
}

.room{
border:1px solid #d8d2c7;
border-radius:9px;
padding:9px;
background:#fff;
display:flex;
align-items:center;
gap:8px;
font-size:11px
}

.room span{font-size:25px}

.product{
border:1px solid #ddd6ca;
border-radius:10px;
padding:8px;
text-align:center;
background:#fff;
font-size:11px
}

.product .ico{font-size:30px}

.product button{
font-size:11px;
padding:7px
}

.tabs{
display:flex;
gap:5px;
overflow:auto;
margin-bottom:9px
}

.tab{
white-space:nowrap;
border:1px solid #d5d0c7;
background:#fff;
border-radius:8px;
padding:7px 10px;
font-size:11px
}

.tab.active{
background:#087f78;
color:#fff
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(430px,100%);
height:70px;
background:#fff;
border-top:1px solid #d5d0c7;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:9
}

.nav{
border:0;
background:none;
color:#586668;
font-size:9px
}

.nav span{
display:block;
font-size:22px
}

.nav.active{
color:#087f78;
font-weight:bold
}

.stars{
color:#e7b21f;
font-size:22px
}

.success{
background:#e0f4e7;
border-left:4px solid #15953e;
padding:10px;
border-radius:7px;
font-size:12px
}

.locked{opacity:.45}
</style>
</head>

let s=JSON.parse(localStorage.getItem("vetlife10")||"null")||initial;


const casesData=[

{

age:"4 anos",

],

function save(){
localStorage.setItem("vetlife10",JSON.stringify(s))
}


function stats(){

document.getElementById("coins").textContent=s.coins;

document.getElementById("gems").textContent=s.gems;

document.getElementById("xp").textContent=s.xp+"/800";

}


function nav(id){

document
.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

}


function addXP(n){

s.xp+=n;

if(s.xp>=800){

s.level++;

s.xp-=800;

}

s.coins+=n;

save();

stats();

}


function steps(n){

let a=[
"Paciente",
"Anamnese",
"Exame",
"Exames",
"Diagnóstico",
"Conduta"
];

return `
<div class="steps">

${a.map((x,i)=>`

<div class="step ${i<=n?"on":""}">

<div class="dot">${i+1}</div>

${x}

</div>

`).join("")}

</div>
`;

}

}

function clinic(){

<div class="screenTitle">

<div class="card">

</div>

<button class="btn" onclick="upgradeClinic()">

</button>

`;

}


function upgradeClinic(){

let cost=1500;

if(s.coins<cost){

alert("Você precisa de "+cost+" moedas.");

return;

}

s.coins-=cost;

s.clinicLevel++;

save();

clinic();

stats();

}


function cases(){

nav("n-home");

content.innerHTML=`

<div class="screenTitle">
Novo Paciente
</div>

${casesData.map((c,i)=>`

<div class="card">

<div class="pet">
${c.pet}
</div>

<h2 style="text-align:center">
${c.name}
</h2>

<p class="muted">
${c.desc}
</p>

<div class="info">

</div>

`;

}


function startCase(i){

if(s.stock<=0){

alert(
"Sem itens de atendimento. Compre recursos na Loja."
);

return;

}

caseFlow(i,0,{});

}


function caseFlow(i,step,state){

let c=casesData[i];


if(step===0){

content.innerHTML=`

<div class="screenTitle">
Novo Paciente
</div>

<div class="card">

${steps(0)}

<div class="pet">
${c.pet}
</div>

<div class="speech">

</div>

<div class="info">

<div>

</div>

<div>

</div>

<div>

</div>

<div>
Idade: ${c.age}
</div>

</div>

<button class="btn" onclick="caseFlow(${i},1,{})">
INICIAR CONSULTA
</button>

</div>

`;

}


else if(step===1){

content.innerHTML=`

<div class="card">

${steps(1)}

<b>
O que você gostaria de perguntar?
</b>

${c.questions.map((q,k)=>`

<button class="choice"
onclick="this.classList.toggle('ok')">

☐ ${q}

</button>

`).join("")}

<button class="btn"
onclick="caseFlow(${i},2,{})">

PRÓXIMO

</button>

</div>

`;

}


else if(step===2){

content.innerHTML=`

<div class="card">

${steps(2)}

<b>
Exame Físico
</b>

<div class="row">
🌡️ Temperatura
<b>38,7 °C</b>
</div>

<div class="row">
❤️ Frequência Cardíaca
<b>96 bpm</b>
</div>

<div class="row">

</div>

<div class="row">

<b>Normocoradas</b>
</div>

<div class="row">

</div>

<div class="row">

<b>32 kg</b>
</div>

<button class="btn"
onclick="caseFlow(${i},3,{})">

PRÓXIMO

</button>

</div>

`;

}


else if(step===3){

content.innerHTML=`

<div class="card">

${steps(3)}

<b>
Quais exames deseja solicitar?
</b>

${[
"Hemograma — 🪙80",
"Bioquímica sérica — 🪙120",
"Urinálise — 🪙60",
"Raio-X — 🪙100",
"Ultrassom abdominal — 🪙150"
].map((x,k)=>`

<button class="choice"
onclick="this.classList.toggle('ok')">

☐ ${x}

</button>

`).join("")}

<button class="btn"
onclick="caseFlow(${i},4,{})">

PRÓXIMO

</button>

</div>

`;

}


else if(step===4){

content.innerHTML=`

<div class="card">

${steps(4)}

<b>

</b>

${c.diagnosis.map((x,k)=>`

<button class="choice"
onclick="diagnosis(${i},${k})">

${x}

</button>

`).join("")}

</div>

`;

}

}


function diagnosis(i,k){

let c=casesData[i];

if(k!==c.correct){

alert(
"Hipótese incorreta. Revise os achados clínicos e tente novamente."
);

return;

}

content.innerHTML=`

<div class="card">

${steps(5)}

<b>
Conduta inicial
</b>

<div class="success">

Diagnóstico selecionado:
<b>${c.diagnosis[k]}</b>

</div>

<div class="row">
☑️ Orientar tutor
<span>✓</span>
</div>

<div class="row">
☑️ Registrar achados
<span>✓</span>
</div>

<div class="row">
☑️ Solicitar acompanhamento
<span>✓</span>
</div>

<button class="btn"
onclick="finishCase(${i})">

FINALIZAR

</button>

</div>

`;

}


function finishCase(i){

let c=casesData[i];

s.done++;

s.stock--;

s.missions.patients++;

s.missions.diagnosis++;

s.missions.exams++;

s.history.push(c.name);

addXP(150);

content.innerHTML=`

<div class="card hero"
style="background:#07877f;color:#fff">

<div class="pet">
${c.pet}
</div>

<div class="stars">
★★★
</div>

<h1>

onclick="cases()">

</button>

</div>

`;

}
