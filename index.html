<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VetLife 1.0</title>

<style>
:root{
--teal:#087f78;
--teal2:#159a91;
--green:#2d9b45;
--lime:#b9ed55;
--cream:#f6f1e6;
--paper:#fffdf8;
--ink:#26363a;
--muted:#6f7d7f;
--line:#d9d3c6;
--gold:#efb934
}

*{box-sizing:border-box}

body{
margin:0;
background:#dce6e2;
font-family:Arial,sans-serif;
color:var(--ink)
}

button{
font:inherit;
cursor:pointer
}

.app{
width:min(100%,430px);
min-height:100vh;
margin:auto;
background:var(--cream);
padding-bottom:78px;
overflow:hidden
}

.top{
background:linear-gradient(135deg,#087f78,#11968e);
color:#fff;
padding:13px 14px 12px
}

.logo{
font-weight:900;
font-size:34px;
letter-spacing:-1.8px
}

.logo span{
color:var(--lime)
}

.paw{
color:#157bc0;
font-size:22px
}

.tag{
font-size:10px;
margin-top:-5px;
margin-left:3px
}

.stats{
display:grid;
grid-template-columns:1.15fr 1fr 1fr;
gap:7px;
margin-top:11px
}

.stat{
background:#fff2;
border:1px solid #ffffff2b;
border-radius:12px;
padding:7px 4px;
text-align:center;
font-size:9px
}

.stat strong{
display:block;
font-size:14px;
margin-top:2px
}

.page{
padding:12px
}

.hero{
border:1px solid #d8d5ca;
border-radius:21px;
overflow:hidden;
background:linear-gradient(150deg,#e0f5e8,#fff5cb);
box-shadow:0 8px 24px #233b3618
}

.hero-art{
height:252px;
position:relative;
overflow:hidden;
background:linear-gradient(#a8d9dd,#e7f0dc 66%,#aebc88 66%)
}

.cloud{
position:absolute;
background:#fff9;
border-radius:50px;
width:85px;
height:25px
}

.c1{left:15px;top:25px}
.c2{right:20px;top:52px;width:65px}

.building{
position:absolute;
left:10px;
bottom:0;
width:220px;
height:110px;
background:#eef1e9;
border:3px solid #aebbb1;
border-radius:9px 9px 0 0
}

.building:before{
content:"VetLife";
position:absolute;
left:18px;
top:10px;
color:#087f78;
font-weight:900;
font-size:17px
}

.win{
position:absolute;
width:39px;
height:29px;
background:#82bbc1;
border:3px solid #718e92;
border-radius:3px;
bottom:20px
}

.w1{left:18px}
.w2{left:76px}
.w3{left:134px}

.door{
position:absolute;
right:14px;
bottom:0;
width:39px;
height:63px;
background:#987e61;
border-radius:4px 4px 0 0
}

.tree{
position:absolute;
right:12px;
bottom:27px;
font-size:65px
}

/* PERSONAGEM */

.char{
position:absolute;
right:5px;
bottom:7px;
width:170px;
height:220px
}

.char .body{
position:absolute;
bottom:0;
left:30px;
width:110px;
height:100px;
background:#fff;
border:3px solid #26363a;
border-radius:45px 45px 15px 15px
}

.char .shirt{
position:absolute;
left:48px;
bottom:0;
width:72px;
height:88px;
background:#e9f5fa;
border-radius:38px 38px 8px 8px
}

.char .neck{
position:absolute;
left:72px;
bottom:82px;
width:30px;
height:30px;
background:#e4a06c;
border-radius:10px
}

.char .head{
position:absolute;
left:43px;
top:38px;
width:88px;
height:92px;
background:#f0ad78;
border-radius:47% 47% 43% 43%;
border:3px solid #5b3528
}

.char .hair{
position:absolute;
left:37px;
top:27px;
width:100px;
height:83px;
background:#553328;
border-radius:55% 55% 40% 42%;
transform:rotate(-3deg)
}

.char .hair2{
position:absolute;
left:43px;
top:58px;
width:22px;
height:78px;
background:#553328;
border-radius:15px
}

.char .eye{
position:absolute;
top:83px;
width:9px;
height:12px;
background:#26363a;
border-radius:50%;
z-index:3
}

.char .e1{left:64px}
.char .e2{left:101px}

.char .nose{
position:absolute;
top:98px;
left:82px;
width:7px;
height:5px;
border-radius:50%;
background:#c47b5e;
z-index:3
}

.char .smile{
position:absolute;
top:105px;
left:76px;
width:25px;
height:13px;
border-bottom:3px solid #8b4b3d;
border-radius:0 0 20px 20px;
z-index:3
}

.char .stetho{
position:absolute;
left:38px;
bottom:38px;
width:95px;
height:55px;
border:4px solid #53a8bd;
border-top:0;
border-radius:0 0 55px 55px;
z-index:4
}

.char .disc{
position:absolute;
right:20px;
bottom:39px;
width:18px;
height:18px;
border-radius:50%;
background:#657278;
border:3px solid #dce5e8;
z-index:5
}

.hero-copy{
padding:14px;
text-align:center
}

.hero-copy h1{
font-size:23px;
margin:0 0 5px
}

.hero-copy p{
margin:0 0 12px;
color:var(--muted);
font-size:13px
}

.primary{
border:0;
color:#fff;
font-weight:900;
background:linear-gradient(#35a64e,#20883a);
border-radius:10px;
padding:12px 16px;
box-shadow:0 4px 0 #176b2c;
width:100%;
font-size:13px
}

.section{
font-weight:900;
font-size:18px;
margin:16px 3px 9px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.menu{
border:1px solid var(--line);
background:var(--paper);
border-radius:13px;
padding:10px;
text-align:center;
box-shadow:0 3px 12px #00000009
}

.menu .ico{
font-size:24px
}

.menu b{
display:block;
font-size:10px;
margin-top:4px
}

.progress{
background:var(--paper);
border:1px solid var(--line);
border-radius:15px;
padding:13px;
margin-top:12px;
box-shadow:0 5px 15px #0001
}

.ph{
display:flex;
justify-content:space-between;
font-weight:800;
font-size:12px
}

.bar{
height:9px;
background:#e2e4df;
border-radius:99px;
overflow:hidden;
margin-top:8px
}

.bar i{
display:block;
height:100%;
background:linear-gradient(90deg,#2ca34d,#35acd0);
border-radius:99px
}

.head{
display:flex;
align-items:center;
gap:8px;
margin:3px 1px 11px
}

.back{
border:1px solid var(--line);
background:#fff;
border-radius:8px;
padding:7px 10px
}

.head h2{
font-size:19px;
margin:0
}

.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:15px;
padding:12px;
margin:9px 0;
box-shadow:0 4px 14px #00000009
}

.pet{
height:185px;
border-radius:13px;
position:relative;
overflow:hidden;
background:linear-gradient(#cfe5d9,#f0e4cc)
}

.pet .floor{
position:absolute;
bottom:0;
width:100%;
height:35px;
background:#b9c894
}

/* CACHORRO */

.dog{
position:absolute;
left:50%;
transform:translateX(-50%);
bottom:10px;
width:150px;
height:150px
}

.dog .ears{
position:absolute;
top:23px;
width:46px;
height:72px;
background:#a86f42;
border-radius:55% 35% 45% 45%;
z-index:1
}

.dog .le{
left:0;
transform:rotate(14deg)
}

.dog .re{
right:0;
transform:rotate(-14deg)
}

.dog .face{
position:absolute;
left:20px;
top:17px;
width:110px;
height:112px;
background:#c58a52;
border-radius:48% 48% 45% 45%;
border:3px solid #734b32;
z-index:2
}

.dog .muzzle{
position:absolute;
left:38px;
top:69px;
width:65px;
height:43px;
background:#e7c28f;
border-radius:50%;
z-index:3
}

.dog .eye{
position:absolute;
top:58px;
width:10px;
height:12px;
background:#2b2925;
border-radius:50%;
z-index:4
}

.dog .e1{left:47px}
.dog .e2{right:47px}

.dog .nose{
position:absolute;
top:76px;
left:68px;
width:22px;
height:15px;
background:#2b2925;
border-radius:50%;
z-index:5
}

.dog .mouth{
position:absolute;
top:89px;
left:60px;
width:37px;
height:22px;
border-bottom:3px solid #713d34;
border-radius:0 0 30px 30px;
z-index:4
}

.dog .tongue{
position:absolute;
top:101px;
left:72px;
width:15px;
height:20px;
background:#df7d82;
border-radius:0 0 12px 12px;
z-index:4
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
margin-top:8px
}

.inf{
background:#f0eee6;
border-radius:8px;
padding:7px;
font-size:10px
}

.inf b{
display:block;
color:#788386;
font-size:8px;
margin-bottom:2px
}

.desc{
font-size:11px;
line-height:1.45;
color:#647477
}

.steps{
display:flex;
margin:2px 0 13px
}

.step{
flex:1;
text-align:center;
font-size:7px;
color:#999
}

.dot{
width:20px;
height:20px;
border-radius:50%;
background:#ddd;
margin:auto auto 2px;
padding-top:4px;
font-weight:800
}

.step.on{
color:var(--teal);
font-weight:800
}

.step.on .dot{
background:var(--teal);
color:white
}

.option{
width:100%;
text-align:left;
border:1px solid #d9ddd7;
background:#fff;
border-radius:8px;
padding:9px;
margin:4px 0;
font-size:10px
}

.option.sel{
background:#e9f7ec;
border-color:#2d9b45
}

.row{
display:flex;
align-items:center;
border-bottom:1px solid #eee;
padding:9px 0;
font-size:10px;
gap:6px
}

.row:last-child{
border:0
}

.row span{
margin-left:auto;
font-weight:800
}

.clinicart{
height:225px;
border-radius:13px;
background:linear-gradient(#d8e9e1 0 70%,#c9a87c 70%);
position:relative;
overflow:hidden;
border:3px solid #b8b2a5
}

.clinicart .window{
position:absolute;
top:25px;
left:25px;
width:78px;
height:62px;
background:#b7d7db;
border:5px solid #fff
}

.clinicart .cab{
position:absolute;
right:15px;
top:18px;
width:90px;
height:90px;
background:#eee6d2;
border:3px solid #a9997e;
border-radius:5px
}

.clinicart .bottles{
position:absolute;
right:28px;
top:35px;
font-size:25px
}

.clinicart .table{
position:absolute;
left:25px;
bottom:38px;
width:110px;
height:45px;
background:#59a8ad;
border:3px solid #668181;
border-radius:8px
}

.clinicart .bed{
position:absolute;
right:18px;
bottom:35px;
width:120px;
height:43px;
background:#e9f0ef;
border:4px solid #768484;
border-radius:8px;
transform:skew(-8deg)
}

.clinicart .plant{
position:absolute;
right:8px;
bottom:95px;
font-size:32px
}

.result{
background:linear-gradient(145deg,#087f78,#149b91);
color:#fff;
text-align:center;
border-radius:17px;
padding:20px
}

.stars{
font-size:28px;
color:#ffd34d
}

.reward{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
margin:12px 0
}

.reward div{
background:#ffffff20;
border-radius:9px;
padding:9px;
font-weight:800;
font-size:11px
}

.shop{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.product{
background:#fff;
border:1px solid var(--line);
border-radius:11px;
padding:9px;
text-align:center;
font-size:9px
}

.product .pi{
font-size:34px
}

.small{
border:0;
background:#e8f4ef;
color:#087f78;
border-radius:7px;
padding:7px;
width:100%;
font-size:9px;
font-weight:800
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(430px,100%);
height:78px;
background:#fff;
border-top:1px solid #d7d3c9;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:20;
box-shadow:0 -5px 15px #00000008
}

.nav{
border:0;
background:none;
color:#687477;
font-size:8px
}

.nav .ni{
display:block;
font-size:19px;
margin-bottom:2px
}

.nav.active{
color:#087f78;
font-weight:900
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="logo">
Vet<span>Life</span> <span class="paw">🐾</span>
</div>

<div class="tag">
Aprenda. Atenda. Evolua.
</div>

<div class="stats">

<div class="stat">
🪙 MOEDAS
<strong id="coins">4250</strong>
</div>

<div class="stat">
💎 RECURSOS
<strong>125</strong>
</div>

<div class="stat">
⭐ NÍVEL
<strong id="level">3</strong>
</div>

</div>

</header>

<main id="page" class="page"></main>

<nav class="bottom">

<button class="nav active" onclick="home()">
🏠
<span class="ni"></span>
Início
</button>

<button class="nav" onclick="missions()">
☑️
<span class="ni"></span>
Missões
</button>

<button class="nav" onclick="clinic()">
🏥
<span class="ni"></span>
Clínica
</button>

<button class="nav" onclick="profile()">
👤
<span class="ni"></span>
Perfil
</button>

<button class="nav" onclick="more()">
•••
<span class="ni"></span>
Mais
</button>

</nav>

</div>

<script>

let s=JSON.parse(localStorage.getItem("vetlife10")||"null")||
{
coins:4250,
xp:350,
level:3,
done:0,
clinic:1
};

const page=document.getElementById("page");

function save(){
localStorage.setItem("vetlife10",JSON.stringify(s))
}

function stats(){
document.getElementById("coins").textContent=s.coins;
document.getElementById("level").textContent=s.level
}

function head(t){
return `
<div class="head">
<button class="back" onclick="home()">←</button>
<h2>${t}</h2>
</div>`
}

function nav(i){
document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".nav")[i]?.classList.add("active")
}

function addXP(n){
s.xp+=n;
s.coins+=n;

if(s.xp>=800){
s.xp-=800;
s.level++
}

save();
stats()
}

/* VETERINÁRIA */

function doctor(){

return `
<div class="char">

<div class="hair"></div>

<div class="head"></div>

<div class="eye e1"></div>
<div class="eye e2"></div>

<div class="nose"></div>
<div class="smile"></div>

<div class="body"></div>
<div class="shirt"></div>
<div class="neck"></div>

<div class="stetho"></div>
<div class="disc"></div>

</div>
`
}

/* CACHORRO */

function dog(){

return `
<div class="dog">

<div class="ears le"></div>
<div class="ears re"></div>

<div class="face"></div>

<div class="eye e1"></div>
<div class="eye e2"></div>

<div class="muzzle"></div>

<div class="nose"></div>
<div class="mouth"></div>
<div class="tongue"></div>

</div>
`
}

/* HOME */

function home(){

nav(0);

page.innerHTML=`

<section class="hero">

<div class="hero-art">

<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="building">

<div class="win w1"></div>
<div class="win w2"></div>
<div class="win w3"></div>

<div class="door"></div>

</div>

<div class="tree">🌳</div>

${doctor()}

</div>

<div class="hero-copy">

<h1>
Bem-vinda à VetLife! 🐾
</h1>

<p>
Sua jornada para se tornar uma excelente veterinária começa aqui.
</p>

<button class="primary" onclick="cases()">
▶ JOGAR
</button>

</div>

</section>

<div class="section">
Menu principal
</div>

<div class="grid">

<button class="menu" onclick="clinic()">
<div class="ico">🏥</div>
<b>MINHA CLÍNICA</b>
</button>

<button class="menu" onclick="profile()">
<div class="ico">👩‍⚕️</div>
<b>MEU PERSONAGEM</b>
</button>

<button class="menu" onclick="cases()">
<div class="ico">🐾</div>
<b>CASOS</b>
</button>

<button class="menu" onclick="ranking()">
<div class="ico">🏆</div>
<b>RANKING</b>
</button>

<button class="menu" onclick="shop()">
<div class="ico">🛒</div>
<b>LOJA</b>
</button>

<button class="menu" onclick="more()">
<div class="ico">⚙️</div>
<b>CONFIGURAÇÕES</b>
</button>

</div>

<div class="progress">

<div class="ph">

<span>
📚 Sua evolução
</span>

<span>
Nível ${s.level}
</span>

</div>

<div class="bar">

<i style="width:${s.xp/8}%"></i>

</div>

<p style="font-size:10px;color:#718084;margin:7px 0 0">

${s.xp}/800 XP • ${s.done} casos concluídos

</p>

</div>

`;
}

/* PERFIL */

function profile(){

nav(3);

page.innerHTML=

head("Meu Personagem")+

`

<div class="card" style="text-align:center">

<div style="height:185px;position:relative">

${doctor()}

</div>

<h2 style="margin:0">
Dra. Júlia Martins
</h2>

<p style="font-size:10px;color:#718084">
Clínica Geral
</p>

<b>
NÍVEL ${s.level}
</b>

<div class="bar">
<i style="width:${s.xp/8}%"></i>
</div>

<p style="font-size:10px;color:#718084">
${s.xp}/800 XP
</p>

</div>

<div class="card">

<b>ATRIBUTOS</b>

${[
"💚 Empatia",
"🧠 Raciocínio",
"⚡ Agilidade",
"💬 Comunicação",
"📋 Organização"
].map(x=>

`<div class="row">${x}<span>● ● ● ○ ○</span></div>`

).join("")}

</div>

`;
}

/* CLÍNICA */

function clinic(){

nav(2);

page.innerHTML=

head("Minha Clínica")+

`

<div class="card">

<div class="clinicart">

<div class="window"></div>
<div class="cab"></div>

<div class="bottles">
🧴🧴
</div>

<div class="table"></div>
<div class="bed"></div>

<div class="plant">
🪴
</div>

</div>

</div>

<div class="card">

<b>Nível da Clínica</b>

<span style="float:right">
⭐ ${s.clinic}
</span>

<div style="color:#e5b12b;font-size:19px">

${"★".repeat(s.clinic)}
${"☆".repeat(5-s.clinic)}

</div>

</div>

<div class="card">

<b>Estruturas</b>

<div class="row">
🩺 Consultório 1
<span>Nível 1 ›</span>
</div>

<div class="row">
🛎️ Recepção
<span>Nível 1 ›</span>
</div>

<div class="row">
🪑 Sala de Espera
<span>Nível 1 ›</span>
</div>

</div>

`;
}

/* CASOS */

const casesData=[

{
name:"Thor",
breed:"Golden Retriever",
pet:"dog",
desc:"Meu cachorro não está bem. Está bebendo mais água, urinando mais e perdeu peso.",
diagnosis:[
"Diabetes mellitus",
"Doença renal crônica",
"Infecção urinária",
"Hiperadrenocorticismo"
]
},

{
name:"Luna",
breed:"SRD",
pet:"cat",
desc:"Luna está vomitando e perdeu o apetite nos últimos dois dias.",
diagnosis:[
"Gastrite",
"Obstrução gastrointestinal",
"Doença renal",
"Parasitismo"
]
}

];

function caseArt(c){

if(c.pet==="dog"){
return dog()
}

return `<div style="font-size:105px;text-align:center;padding-top:28px">🐱</div>`
}

function cases(){

nav(0);

page.innerHTML=

head("Mapa de Casos")+

casesData.map((c,i)=>`

<div class="card">

<div class="pet">

${caseArt(c)}

<div class="floor"></div>

</div>

<h2 style="margin:9px 0 4px">
${c.name}
</h2>

<p class="desc">
${c.desc}
</p>

<div class="info">

<div class="inf">
<b>ESPÉCIE</b>
Canino
</div>

<div class="inf">
<b>RAÇA</b>
${c.breed}
</div>

<div class="inf">
<b>IDADE</b>
4 anos
</div>

<div class="inf">
<b>SEXO</b>
Macho
</div>

</div>

<button class="primary"
style="margin-top:9px"
onclick="flow(${i},0)">
