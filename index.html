<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VetLife 0.4</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe8e5;font-family:Arial,sans-serif;color:#294844}#app{max-width:430px;min-height:100vh;margin:auto;background:#faf7ef}.top{background:#087774;color:#fff;padding:14px;position:sticky;top:0}.brand{font-size:26px;font-weight:900}.brand b{color:#c7eb72}.stats{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.stats span{background:#ffffff22;padding:6px 8px;border-radius:9px;font-size:12px}main{padding:14px 13px 80px}.hero{background:linear-gradient(145deg,#e2f2ec,#d9ebf5);border-radius:22px;padding:20px;text-align:center}.avatar{font-size:78px}.title{font-size:22px;font-weight:900;margin:9px 0}.sub{font-size:13px;color:#71817f}.section{font-size:19px;font-weight:900;margin:18px 0 7px}.card{background:#fffdf8;border:1px solid #e1e3dc;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 8px #0000000b}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:10px;font-weight:800;background:#38a85b;color:#fff;font-size:14px}.gold{background:#efb52d}.scene{height:340px;position:relative;background:#efd9b8;border:4px solid #c99b69;border-radius:20px;overflow:hidden}.room{position:absolute;background:#fff3dc;border:2px solid #d5b17d;border-radius:12px;text-align:center;font-size:10px;font-weight:bold;padding:8px}.r1{left:7px;top:7px;width:48%;height:120px}.r2{right:7px;top:7px;width:48%;height:120px}.r3{left:7px;bottom:7px;width:48%;height:120px}.r4{right:7px;bottom:7px;width:48%;height:120px}.doctor{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:58px}.obj{position:absolute;font-size:29px}.plant{left:18px;top:48px}.chair{right:18px;top:48px}.desk{left:50%;top:47px;transform:translateX(-50%)}.sofa{left:50%;bottom:25px;transform:translateX(-50%)}.patient{font-size:92px;background:#e7f2e9;border-radius:18px;padding:10px;text-align:center}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ecece7;padding:9px 0}.option{display:block;width:100%;padding:12px;margin:7px 0;background:#fff;border:1px solid #d8e0dc;border-radius:11px;text-align:left}.notice{background:#fff3c8;padding:11px;border-radius:12px;margin-top:10px;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:64px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around}nav button{border:0;background:none;color:#506562;font-size:20px}nav small{display:block;font-size:10px}</style></head><body><div id="app"><header class="top"><div class="brand">Vet<b>Life</b> 🐾</div><div class="stats"><span>🪙 <b id="coins">1200</b></span><span>⭐ <b id="xp">0</b></span><span>🏥 Nível <b id="level">1</b></span></div></header><main id="screen"></main><nav><button onclick="home()">🏠<small>Início</small></button><button onclick="clinic()">🏥<small>Clínica</small></button><button onclick="cases()">🐾<small>Casos</small></button></nav></div><script>
const S={coins:1200,xp:0,level:1,done:false,pick:""};const C={name:"Thor",emoji:"🐶",diagnosis:"Diabetes mellitus",story:"Está bebendo muita água, urinando muito e emagreceu."};function sync(){coins.textContent=S.coins;xp.textContent=S.xp;level.textContent=S.level}function go(x){screen.innerHTML=x;sync()}function btn(t,f,c=""){return `<button class="btn ${c}" onclick="${f}">${t}</button>`}function scene(){return `<div class="scene"><div class="room r1">🛎️ RECEPÇÃO<div class="obj plant">🪴</div><div class="obj chair">🪑</div></div><div class="room r2">🩺 CONSULTÓRIO<div class="obj desk">🖥️</div></div><div class="room r3">🛋️ ESPERA<div class="obj sofa">🛋️</div></div><div class="room r4">🛒 DECORAÇÃO</div><div class="doctor">👩‍⚕️</div></div>`}function home(){go(`<div class="hero"><div class="avatar">👩‍⚕️</div><div class="title">Bem-vinda ao VetLife!</div><div class="sub">Sua clínica está começando a crescer.</div>${btn("🐾 ATENDER THOR","start()")}</div><div class="section">🏥 Minha Clínica</div><div class="card">${scene()}</div>`)}function clinic(){go(`<div class="section">🏥 Minha Clínica</div><div class="card">${scene()}</div><div class="card"><div class="row"><span>Nível</span><b>${S.level}</b></div><div class="row"><span>VetCoins</span><b>🪙 ${S.coins}</b></div></div>${S.level<5?`<div class="card"><b>Próximo desbloqueio</b><p>🔬 Novo espaço da clínica</p>${btn("UPGRADE — 500 🪙","upgrade()","gold")}</div>`:`<div class="notice">🏆 Clínica no nível máximo!</div>`}`)}function upgrade(){if(S.coins<500){alert("Você precisa de 500 VetCoins.");return}S.coins-=500;S.level++;S.xp+=80;clinic()}function cases(){go(`<div class="section">🐾 Casos Clínicos</div><div class="notice">🟢 Fácil = 50 VetCoins • 🟡 Médio = 150 • 🔴 Difícil = 250</div><div class="card"><div class="patient">${C.emoji}</div><h2>${C.name}</h2><p class="sub">${C.story}</p>${btn("ATENDER THOR","start()")}</div>`)}function start(){go(`<div class="section">🐾 Novo paciente</div><div class="card"><div class="patient">${C.emoji}</div><h2>${C.name}</h2><p>${C.story}</p><b>🟢 Fácil • 🪙 50</b>${btn("INICIAR CONSULTA","anamnesis()")}</div>`)}function anamnesis(){let q=["Há quanto tempo começou?","Mudou o apetite?","Está usando medicamentos?","Bebe mais água?","Está urinando mais?","Houve vômitos ou diarreia?"];go(`<div class="section">📋 Anamnese</div><div class="card"><b>Escolha perguntas importantes:</b>${q.map(x=>`<button class="option" onclick="this.style.background='#e9f8ed'">${x}</button>`).join("")}${btn("PRÓXIMO","physical()")}</div>`)}function physical(){go(`<div class="section">🩺 Exame físico</div><div class="card"><div class="row"><span>🌡️ Temperatura</span><b>Avaliada</b></div><div class="row"><span>💧 Hidratação</span><b>Alterada</b></div><div class="row"><span>⚖️ Peso</span><b>Reduzido</b></div></div><div class="notice">🔎 Pista: muita sede, muita urina e perda de peso.</div>${btn("MONTAR DIAGNÓSTICO","diagnosis()")}`)}function diagnosis(){let a=["Diabetes mellitus","Doença renal crônica","Gastroenterite","Infecção urinária"];go(`<div class="section">🧠 Raciocínio clínico</div><div class="card"><b>Qual diagnóstico é mais provável?</b>${a.map(x=>`<button class="option" onclick='S.pick=${JSON.stringify(x)};document.querySelectorAll(".option").forEach(e=>e.style.background="#fff");this.style.background="#e9f8ed"'>${x}</button>`).join("")}${btn("CONFIRMAR","check()")}</div>`)}function check(){if(S.pick===C.diagnosis){let r=S.done?0:50;if(!S.done){S.coins+=r;S.done=true}S.xp+=100;S.level=Math.floor(S.xp/500)+1;go(`<div class="hero"><div class="avatar">🐶</div><div class="title">🎉 Diagnóstico correto!</div><div class="sub">Diabetes mellitus</div></div><div class="card"><div class="row"><span>⭐ XP</span><b>+100</b></div><div class="row"><span>🪙 VetCoins</span><b>+${r}</b></div></div>${btn("VOLTAR AOS CASOS","cases()")}`)}else{go(`<div class="hero"><div class="title">⚠️ Vamos revisar</div><div class="sub">A hipótese esperada é <b>Diabetes mellitus</b>.</div></div><div class="notice">💡 Observe a combinação entre sede aumentada, urina em excesso e perda de peso.</div>${btn("TENTAR NOVAMENTE","diagnosis()")}`)}}home();</script></body></html>
